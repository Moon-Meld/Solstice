<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="space-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141B2D" />
      <stop offset="60%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#05070B" />
    </radialGradient>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="gold-linear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="25%" stop-color="#E5C365" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#9A7B2C" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>

    <linearGradient id="gold-accent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0" />
      <stop offset="50%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#684F12" />
    </linearGradient>

    <!-- Celestial Cyan / Starlight Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Filters for Ethereal Glow -->
    <filter id="bloom-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="core-flare" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Space Shield Base -->
  <rect width="512" height="512" rx="112" fill="url(#space-glow)" stroke="#23304A" stroke-width="2" />

  <!-- Outer Astrolabe Celestial Graduation Circle -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#gold-linear)" stroke-width="1.5" opacity="0.35" />
  <circle cx="256" cy="256" r="208" fill="none" stroke="url(#gold-linear)" stroke-width="2" opacity="0.7" />
  <circle cx="256" cy="256" r="198" fill="none" stroke="#23304A" stroke-width="1" stroke-dasharray="2 6" />

  <!-- Meridian Coordinate Ticks -->
  <g stroke="url(#gold-linear)" stroke-width="2" opacity="0.6">
    <line x1="256" y1="40" x2="256" y2="52" />
    <line x1="256" y1="460" x2="256" y2="472" />
    <line x1="40" y1="256" x2="52" y2="256" />
    <line x1="460" y1="256" x2="472" y2="256" />
    <!-- Diagonal Ticks -->
    <line x1="103" y1="103" x2="113" y2="113" />
    <line x1="409" y1="409" x2="399" y2="399" />
    <line x1="409" y1="103" x2="399" y2="113" />
    <line x1="103" y1="409" x2="113" y2="399" />
  </g>

  <!-- Orbital Armillary Ellipses (Graph-RAG Trajectories) -->
  <ellipse cx="256" cy="256" rx="190" ry="86" fill="none" stroke="url(#cyan-glow)" stroke-width="1.5" opacity="0.45" transform="rotate(-30 256 256)" />
  <ellipse cx="256" cy="256" rx="190" ry="86" fill="none" stroke="url(#gold-linear)" stroke-width="1.5" opacity="0.4" transform="rotate(30 256 256)" />
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="4 6" opacity="0.5" transform="rotate(90 256 256)" />

  <!-- Constellation Starlight Micro-nodes -->
  <g fill="url(#cyan-glow)">
    <circle cx="106" cy="170" r="3.5" filter="url(#bloom-gold)" />
    <circle cx="406" cy="342" r="3.5" filter="url(#bloom-gold)" />
    <circle cx="120" cy="350" r="3" />
    <circle cx="392" cy="162" r="3" />
  </g>

  <!-- Sacred Geometry Concentric Diamond Grid -->
  <g stroke="url(#gold-accent)" stroke-width="1" opacity="0.35" fill="none">
    <polygon points="256,76 436,256 256,436 76,256" />
    <polygon points="256,106 406,256 256,406 106,256" />
  </g>

  <!-- Middle Astrolabe Ring with Roman Solstice Markers -->
  <circle cx="256" cy="256" r="142" fill="none" stroke="url(#gold-linear)" stroke-width="3" filter="url(#bloom-gold)" />
  <circle cx="256" cy="256" r="132" fill="#0B0F19" fill-opacity="0.6" stroke="#23304A" stroke-width="1.5" />

  <!-- Master Solstice Zenith Star (至日主星 - 8-Pointed Starburst) -->
  <g filter="url(#core-flare)">
    <!-- Primary Cardinal Rays -->
    <path d="M 256,64 L 272,238 L 448,256 L 272,274 L 256,448 L 240,274 L 64,256 L 240,238 Z" 
          fill="url(#gold-linear)" stroke="#FFF5D6" stroke-width="1.5" />
    
    <!-- Secondary Intercardinal Rays -->
    <path d="M 256,128 L 268,244 L 384,256 L 268,268 L 256,384 L 244,268 L 128,256 L 244,244 Z" 
          fill="url(#gold-accent)" opacity="0.85" />
  </g>

  <!-- Inner Zenith Core Jewel -->
  <circle cx="256" cy="256" r="34" fill="#0B0F19" stroke="url(#gold-linear)" stroke-width="2.5" />
  <circle cx="256" cy="256" r="24" fill="url(#gold-linear)" filter="url(#bloom-gold)" />
  <circle cx="256" cy="256" r="10" fill="#FFFFFF" />

  <!-- Micro Flare Sparks -->
  <circle cx="256" cy="180" r="2" fill="#FFF5D6" />
  <circle cx="256" cy="332" r="2" fill="#FFF5D6" />
  <circle cx="180" cy="256" r="2" fill="#FFF5D6" />
  <circle cx="332" cy="256" r="2" fill="#FFF5D6" />
</svg>

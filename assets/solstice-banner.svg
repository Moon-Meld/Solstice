<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Deep Obsidian Night Sky with Celestial Dusting -->
    <radialGradient id="sky-core" cx="35%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#141A2D" />
      <stop offset="40%" stop-color="#0B0F19" />
      <stop offset="85%" stop-color="#06080E" />
      <stop offset="100%" stop-color="#030407" />
    </radialGradient>

    <!-- Celestial Gold Foil Gradient -->
    <linearGradient id="gold-leaf" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFF8E7" />
      <stop offset="20%" stop-color="#F3E5AB" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA8222" />
      <stop offset="90%" stop-color="#E2C158" />
      <stop offset="100%" stop-color="#846316" />
    </linearGradient>

    <!-- Subtle Starlight Teal Flare -->
    <radialGradient id="teal-starlight" cx="75%" cy="30%" r="40%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.16)" />
      <stop offset="60%" stop-color="rgba(56, 189, 248, 0.02)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>

    <!-- Soft Golden Nebula Glow -->
    <radialGradient id="amber-dust" cx="28%" cy="50%" r="45%">
      <stop offset="0%" stop-color="rgba(212, 175, 55, 0.22)" />
      <stop offset="50%" stop-color="rgba(212, 175, 55, 0.04)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>

    <!-- Bloom Filter for Master Star -->
    <filter id="art-bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="fine-dust" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;display=swap');
    .serif-cap { font-family: 'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif; }
    .sans-sub { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono-coords { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" fill="url(#sky-core)" />
  <rect width="1200" height="400" fill="url(#amber-dust)" />
  <rect width="1200" height="400" fill="url(#teal-starlight)" />

  <!-- Classical Architectural Framing & Astrological Graticule -->
  <rect x="18" y="18" width="1164" height="364" rx="12" fill="none" stroke="url(#gold-leaf)" stroke-width="1.2" opacity="0.4" />
  <rect x="26" y="26" width="1148" height="348" rx="8" fill="none" stroke="#23304A" stroke-width="0.8" stroke-dasharray="4 6" opacity="0.6" />

  <!-- Corner Flourishes (Sacred Geometry Crosslets) -->
  <g stroke="url(#gold-leaf)" stroke-width="1" opacity="0.6">
    <!-- Top Left -->
    <line x1="32" y1="38" x2="48" y2="38" />
    <line x1="38" y1="32" x2="38" y2="48" />
    <circle cx="38" cy="38" r="2" fill="#D4AF37" />
    <!-- Top Right -->
    <line x1="1152" y1="38" x2="1168" y2="38" />
    <line x1="1162" y1="32" x2="1162" y2="48" />
    <circle cx="1162" cy="38" r="2" fill="#D4AF37" />
    <!-- Bottom Left -->
    <line x1="32" y1="362" x2="48" y2="362" />
    <line x1="38" y1="352" x2="38" y2="368" />
    <circle cx="38" cy="362" r="2" fill="#D4AF37" />
    <!-- Bottom Right -->
    <line x1="1152" y1="362" x2="1168" y2="362" />
    <line x1="1162" y1="352" x2="1162" y2="368" />
    <circle cx="1162" cy="362" r="2" fill="#D4AF37" />
  </g>

  <!-- Left Artistic Composition: Armillary Sphere & Solstice Dial (浑天浑象) -->
  <g transform="translate(230, 200)">
    <!-- Horizon Line & Meridian Axes -->
    <line x1="-165" y1="0" x2="165" y2="0" stroke="rgba(212, 175, 55, 0.25)" stroke-width="0.8" />
    <line x1="0" y1="-165" x2="0" y2="165" stroke="rgba(212, 175, 55, 0.25)" stroke-width="0.8" />

    <!-- Outer Celestial Graduation Ring (360 degrees dial) -->
    <circle cx="0" cy="0" r="148" fill="none" stroke="url(#gold-leaf)" stroke-width="1" opacity="0.35" />
    <circle cx="0" cy="0" r="142" fill="none" stroke="#23304A" stroke-width="1.5" />
    <circle cx="0" cy="0" r="136" fill="none" stroke="url(#gold-leaf)" stroke-width="0.8" stroke-dasharray="2 6" opacity="0.6" />

    <!-- Equator and Solstice Ecliptic Rings -->
    <ellipse cx="0" cy="0" rx="142" ry="46" fill="none" stroke="url(#gold-leaf)" stroke-width="1.2" opacity="0.65" transform="rotate(-23.44)" />
    <ellipse cx="0" cy="0" rx="142" ry="46" fill="none" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1" stroke-dasharray="4 6" transform="rotate(23.44)" />
    <ellipse cx="0" cy="0" rx="136" ry="90" fill="none" stroke="rgba(212, 175, 55, 0.3)" stroke-width="0.8" stroke-dasharray="1 5" />

    <!-- Sacred 12-Ray Solstice Projection -->
    <g stroke="rgba(212, 175, 55, 0.2)" stroke-width="0.8">
      <line x1="0" y1="-142" x2="0" y2="142" transform="rotate(30)" />
      <line x1="0" y1="-142" x2="0" y2="142" transform="rotate(60)" />
      <line x1="0" y1="-142" x2="0" y2="142" transform="rotate(120)" />
      <line x1="0" y1="-142" x2="0" y2="142" transform="rotate(150)" />
    </g>

    <!-- Graph-RAG Orbital Starlight Particle Nodes -->
    <g fill="#D4AF37">
      <circle cx="-110" cy="-62" r="3" filter="url(#fine-dust)" />
      <circle cx="118" cy="58" r="3.5" filter="url(#fine-dust)" fill="#38BDF8" />
      <circle cx="-56" cy="118" r="2.5" />
      <circle cx="68" cy="-105" r="2.8" />
      <circle cx="138" cy="-15" r="3.2" filter="url(#art-bloom)" />
    </g>

    <!-- Connective Neural Lines (The Graph) -->
    <path d="M -110,-62 Q -30,-40 68,-105 T 138,-15 T 118,58 T -56,118" 
          fill="none" stroke="rgba(212, 175, 55, 0.35)" stroke-width="0.9" stroke-dasharray="3 4" />

    <!-- Master Solstice Octagram Sunburst (8-Pointed Zenith Star) -->
    <g filter="url(#art-bloom)">
      <polygon points="0,-72 9,-18 72,0 9,18 0,72 -9,18 -72,0 -9,-18" fill="url(#gold-leaf)" />
      <polygon points="0,-42 7,-11 42,0 7,11 0,42 -7,11 -42,0 -7,-11" fill="#FFFDF5" opacity="0.95" />
    </g>
    <!-- Core Solstice Jewel -->
    <circle cx="0" cy="0" r="10" fill="#0B0F19" stroke="url(#gold-leaf)" stroke-width="1.8" />
    <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" />
  </g>

  <!-- Right / Main Content: Curatorial Typography (优雅典籍排印) -->
  <g transform="translate(460, 95)">
    <!-- Astronomical Epigraph & Metadata -->
    <g opacity="0.75">
      <text x="0" y="2" fill="#D4AF37" class="mono-coords" font-size="10" letter-spacing="3">
        ✦ RA 06h 00m · DEC +23° 26' 12" · THE SOLSTICE ZENITH
      </text>
      <line x1="380" y1="-2" x2="680" y2="-2" stroke="rgba(212, 175, 55, 0.25)" stroke-width="0.8" />
    </g>

    <!-- Main Title: Inscriptional Roman & Classical Calligraphy -->
    <text x="0" y="68" fill="url(#gold-leaf)" class="serif-cap" font-size="52" font-weight="700" letter-spacing="7">
      SOLSTICE <tspan font-family="'Songti SC', 'STSong', serif" font-weight="400" font-size="44" fill="#FBF3DA">至 日</tspan>
    </text>

    <!-- Subtitle: Artisan Starlight -->
    <text x="0" y="108" fill="#E2E8F0" class="sans-sub" font-size="17" font-weight="500" letter-spacing="2">
      The AI Career Artisan &amp; Master Orchestrator
    </text>

    <!-- Philosophical Creed (The Canvas Principle) -->
    <g transform="translate(0, 136)">
      <line x1="0" y1="0" x2="38" y2="0" stroke="#D4AF37" stroke-width="1.5" />
      <text x="50" y="4" fill="#94A3B8" class="sans-sub" font-size="12.5" font-weight="400" font-style="italic" letter-spacing="0.5">
        “Treat every resume, skill tree, and career trajectory as an evolving work of art.”
      </text>
      <text x="0" y="28" fill="#CBD5E1" class="sans-sub" font-size="12" font-weight="400">
        双核 Graph-RAG 引擎 · 拒绝机械清单 · 以严谨量化与叙事张力雕琢精英生涯
      </text>
    </g>

    <!-- Four Atelier Curatorial Seals (四联工坊微章) -->
    <g transform="translate(0, 202)">
      <!-- Atelier 1: Self-Portrait -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="156" height="32" rx="6" fill="rgba(17, 23, 38, 0.7)" stroke="rgba(212, 175, 55, 0.3)" stroke-width="0.9" />
        <text x="14" y="20" fill="#F5E6BE" class="serif-cap" font-size="11" font-weight="600" letter-spacing="1">
          🎨 工笔 · 自画像
        </text>
      </g>

      <!-- Atelier 2: Constellation -->
      <g transform="translate(170, 0)">
        <rect x="0" y="0" width="156" height="32" rx="6" fill="rgba(17, 23, 38, 0.7)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.9" />
        <text x="14" y="20" fill="#38BDF8" class="serif-cap" font-size="11" font-weight="600" letter-spacing="1">
          🌌 天穹 · 星宿图
        </text>
      </g>

      <!-- Atelier 3: The Rehearsal -->
      <g transform="translate(340, 0)">
        <rect x="0" y="0" width="156" height="32" rx="6" fill="rgba(17, 23, 38, 0.7)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="0.9" />
        <text x="14" y="20" fill="#FBBF24" class="serif-cap" font-size="11" font-weight="600" letter-spacing="1">
          🎭 声相 · 排练场
        </text>
      </g>

      <!-- Atelier 4: Odyssey -->
      <g transform="translate(510, 0)">
        <rect x="0" y="0" width="156" height="32" rx="6" fill="rgba(17, 23, 38, 0.7)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="0.9" />
        <text x="14" y="20" fill="#34D399" class="serif-cap" font-size="11" font-weight="600" letter-spacing="1">
          🧭 远航 · 奥德赛
        </text>
      </g>
    </g>
  </g>
</svg>

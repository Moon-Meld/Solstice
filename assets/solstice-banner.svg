<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradient: Deep Obsidian Night -->
    <radialGradient id="nebula-glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#141B2E" />
      <stop offset="45%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#05070B" />
    </radialGradient>

    <radialGradient id="solstice-gold-bloom" cx="50%" cy="30%" r="35%">
      <stop offset="0%" stop-color="rgba(212, 175, 55, 0.22)" />
      <stop offset="60%" stop-color="rgba(212, 175, 55, 0.03)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>

    <radialGradient id="cyan-starlight-glow" cx="68%" cy="25%" r="30%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>

    <!-- Metallic Gold Text Gradients -->
    <linearGradient id="gold-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFF3D6" />
      <stop offset="50%" stop-color="#E5C365" />
      <stop offset="85%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#A27D24" />
    </linearGradient>

    <linearGradient id="gold-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5" />
      <stop offset="30%" stop-color="#F5E6BE" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#846416" />
    </linearGradient>

    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="core-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .serif-title { font-family: 'Cinzel', 'Playfair Display', 'Times New Roman', serif; }
    .sans-text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono-code { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
  </style>

  <!-- Canvas Base -->
  <rect width="1200" height="360" rx="16" fill="url(#nebula-glow)" />
  <rect width="1200" height="360" fill="url(#solstice-gold-bloom)" />
  <rect width="1200" height="360" fill="url(#cyan-starlight-glow)" />

  <!-- Elegant Framing Line -->
  <rect x="16" y="16" width="1168" height="328" rx="12" fill="none" stroke="#23304A" stroke-width="1.2" opacity="0.6" />
  <rect x="22" y="22" width="1156" height="316" rx="8" fill="none" stroke="rgba(212, 175, 55, 0.15)" stroke-width="0.8" stroke-dasharray="6 8" />

  <!-- Constellation Nodes & Geometry Background Trails -->
  <g stroke="rgba(100, 116, 139, 0.16)" stroke-width="1" fill="none">
    <line x1="80" y1="180" x2="180" y2="120" />
    <line x1="180" y1="120" x2="280" y2="200" />
    <line x1="280" y1="200" x2="220" y2="280" />
    <line x1="920" y1="110" x2="1020" y2="170" />
    <line x1="1020" y1="170" x2="1120" y2="130" />
    <line x1="1020" y1="170" x2="980" y2="270" />
  </g>
  <g fill="#D4AF37" opacity="0.6">
    <circle cx="80" cy="180" r="2.5" />
    <circle cx="180" cy="120" r="3.5" filter="url(#core-glow)" />
    <circle cx="280" cy="200" r="3" />
    <circle cx="220" cy="280" r="2.5" />
    <circle cx="920" cy="110" r="2.5" />
    <circle cx="1020" cy="170" r="4" filter="url(#core-glow)" fill="#38BDF8" />
    <circle cx="1120" cy="130" r="2.5" />
    <circle cx="980" cy="270" r="3" />
  </g>

  <!-- Centered Astrolabe Celestial Emblem -->
  <g transform="translate(600, 84)">
    <!-- Orbital Rings -->
    <circle cx="0" cy="0" r="44" fill="none" stroke="url(#gold-star)" stroke-width="1.2" opacity="0.45" />
    <circle cx="0" cy="0" r="38" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="3 5" opacity="0.5" />
    <ellipse cx="0" cy="0" rx="46" ry="16" fill="none" stroke="#D4AF37" stroke-width="0.9" opacity="0.4" transform="rotate(-28)" />
    <ellipse cx="0" cy="0" rx="46" ry="16" fill="none" stroke="#38BDF8" stroke-width="0.9" opacity="0.4" transform="rotate(28)" />

    <!-- 8-Pointed Master Solstice Starburst -->
    <polygon points="0,-36 5,-8 36,0 5,8 0,36 -5,8 -36,0 -5,-8" fill="url(#gold-star)" filter="url(#core-glow)" />
    <polygon points="0,-20 3,-5 20,0 3,5 0,20 -3,5 -20,0 -3,-5" fill="#FFFDF5" opacity="0.9" />
    <circle cx="0" cy="0" r="4.5" fill="#0B0F19" stroke="#D4AF37" stroke-width="1.2" />
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
  </g>

  <!-- Main Brand Title (Centered, Pure Elegance) -->
  <text x="600" y="174" text-anchor="middle" fill="url(#gold-title)" class="serif-title" font-size="44" font-weight="700" letter-spacing="6">
    SOLSTICE <tspan font-size="32" font-weight="500" fill="#F5E6BE">至日</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="210" text-anchor="middle" fill="url(#cyan-accent)" class="sans-text" font-size="14" font-weight="600" letter-spacing="2.5">
    AI CAREER ARTISAN &amp; MASTER ORCHESTRATOR
  </text>

  <!-- Philosophy Motto -->
  <text x="600" y="244" text-anchor="middle" fill="#94A3B8" class="sans-text" font-size="13" font-weight="400" letter-spacing="0.5">
    “The Canvas Principle” · 双核 Graph-RAG 引擎 · 每一份经历皆是持续演进的艺术品
  </text>

  <!-- Minimalist Pill Badges Bar -->
  <g transform="translate(600, 276)">
    <!-- Atelier 1 -->
    <g transform="translate(-330, 0)">
      <rect x="0" y="0" width="155" height="28" rx="14" fill="rgba(17, 23, 38, 0.85)" stroke="rgba(212, 175, 55, 0.25)" />
      <text x="77" y="18" text-anchor="middle" fill="#F5E6BE" class="sans-text" font-size="11" font-weight="500">🎨 自画像 Self-Portrait</text>
    </g>

    <!-- Atelier 2 -->
    <g transform="translate(-165, 0)">
      <rect x="0" y="0" width="160" height="28" rx="14" fill="rgba(17, 23, 38, 0.85)" stroke="rgba(56, 189, 248, 0.25)" />
      <text x="80" y="18" text-anchor="middle" fill="#38BDF8" class="sans-text" font-size="11" font-weight="500">🌌 星宿图 Constellation</text>
    </g>

    <!-- Atelier 3 -->
    <g transform="translate(5, 0)">
      <rect x="0" y="0" width="155" height="28" rx="14" fill="rgba(17, 23, 38, 0.85)" stroke="rgba(245, 158, 11, 0.25)" />
      <text x="77" y="18" text-anchor="middle" fill="#FBBF24" class="sans-text" font-size="11" font-weight="500">🎭 排练场 The Rehearsal</text>
    </g>

    <!-- Atelier 4 -->
    <g transform="translate(170, 0)">
      <rect x="0" y="0" width="150" height="28" rx="14" fill="rgba(17, 23, 38, 0.85)" stroke="rgba(16, 185, 129, 0.25)" />
      <text x="75" y="18" text-anchor="middle" fill="#34D399" class="sans-text" font-size="11" font-weight="500">🧭 奥德赛 Odyssey</text>
    </g>
  </g>
</svg>

### Model
model_name_or_path: Qwen/Qwen2.5-14B-Instruct
trust_remote_code: true

### Method
stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: all
pref_beta: 0.1
pref_loss: sigmoid
pref_ftx: 0.0

### Dataset
dataset: dpo_artisan_writer
dataset_dir: training/data
template: qwen
cutoff_len: 2048
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 8

### Hyperparameters
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01

### Precision & Engine
bf16: true
deepspeed: training/configs/ds_z2_config.json

### Output & Logging
output_dir: saves/qwen25_14b_artisan_writer_dpo
logging_steps: 10
save_strategy: epoch
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true

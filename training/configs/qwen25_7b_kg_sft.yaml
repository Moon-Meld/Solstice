### Model
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
trust_remote_code: true

### Method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: all

### Dataset
dataset: sft_kg_extractor
dataset_dir: training/data
template: qwen
cutoff_len: 2048
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 8

### Hyperparameters
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01

### Precision & Engine
bf16: true
deepspeed: training/configs/ds_z2_config.json

### Output & Logging
output_dir: saves/qwen25_7b_kg_extractor_lora
logging_steps: 10
save_strategy: epoch
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
